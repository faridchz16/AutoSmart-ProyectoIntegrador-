server.port=8081
spring.application.name=backend

# Conexion local a MySQL desde SQLyog
spring.datasource.url=jdbc:mysql://localhost:3306/autosmart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: clave fija (mínimo 32 caracteres) y vigencia de 60 minutos
jwt.secret=${JWT_SECRET:AutoSmart_Tecsup_ProyectoIntegrador_ClaveSecretaJWT_2026}
jwt.expiration-ms=3600000

# Correo de confirmacion (T29.1): las credenciales van en variables de entorno
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Fotos de deficiencias (T44.1): carpeta configurable; en la BD solo se guarda el nombre del archivo
app.fotos.directorio=${FOTOS_DIR:uploads/fotos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Permite responder el 400 aunque el archivo sea muy grande (sin cortar la conexion)
server.tomcat.max-swallow-size=-1
# Notificaciones push (T54.1): ruta al JSON de la cuenta de servicio de Firebase. Nunca se sube al repositorio.
app.firebase.credenciales=${FIREBASE_CREDENTIALS:}